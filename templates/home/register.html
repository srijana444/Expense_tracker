{% extends 'base.html' %}

{% block body %}

<div class="login-page">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="overlay"></div>

        <div class="welcome-section">

            <h1>Create Your Account</h1>

            <p>
                Join Expense Tracker and manage your income,
                expenses and savings in one secure place.
            </p>

        </div>

    </div>

    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <div class="register-card">

            <div class="login-header">

                <h2>Create Account</h2>

                <p>
                    Fill in the details below to get started.
                </p>

            </div>

            <form action="/handleSignup/" method="post">

                {% csrf_token %}

                <!-- Username -->

                <div class="form-group">

                    <label for="uname">

                        <i class="fas fa-user"></i>

                        Username

                    </label>

                    <input
                        type="text"
                        id="uname"
                        name="uname"
                        class="form-control"
                        placeholder="Enter username"
                        required>

                </div>

                <!-- First & Last Name -->

                <div class="row">

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="fname">

                                <i class="fas fa-id-card"></i>

                                First Name

                            </label>

                            <input
                                type="text"
                                id="fname"
                                name="fname"
                                class="form-control"
                                placeholder="First Name">

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="lname">

                                <i class="fas fa-id-card"></i>

                                Last Name

                            </label>

                            <input
                                type="text"
                                id="lname"
                                name="lname"
                                class="form-control"
                                placeholder="Last Name">

                        </div>

                    </div>

                </div>

                <!-- Email -->

                <div class="form-group">

                    <label for="email">

                        <i class="fas fa-envelope"></i>

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="Enter email"
                        required>

                </div>

                <!-- Profession -->

                <div class="form-group">

                    <label for="profession">

                        <i class="fas fa-briefcase"></i>

                        Profession

                    </label>

                    <select
                        id="profession"
                        name="profession"
                        class="form-control">

                        <option value="Employee">Employee</option>
                        <option value="Business">Business</option>
                        <option value="Student">Student</option>
                        <option value="Other">Other</option>

                    </select>

                </div>

                <!-- Income & Savings -->

                <div class="row">

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="income">

                                <i class="fas fa-wallet"></i>

                                Income

                            </label>

                            <input
                                type="text"
                                id="income"
                                name="income"
                                class="form-control"
                                placeholder="Monthly Income"
                                required>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="Savings">

                                <i class="fas fa-piggy-bank"></i>

                                Savings Goal

                            </label>

                            <input
                                type="text"
                                id="Savings"
                                name="Savings"
                                class="form-control"
                                placeholder="Savings"
                                required>

                        </div>

                    </div>

                </div>
                                <!-- Password Row -->

                <div class="row">

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="pass1">

                                <i class="fas fa-lock"></i>

                                Password

                            </label>

                            <div class="password-box">

                                <input
                                    type="password"
                                    id="pass1"
                                    name="pass1"
                                    class="form-control"
                                    placeholder="Enter Password"
                                    minlength="8"
                                    maxlength="20"
                                    required>

                                <span
                                    class="toggle-password"
                                    onclick="togglePassword('pass1', this)">

                                    <i class="fas fa-eye"></i>

                                </span>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="form-group">

                            <label for="pass2">

                                <i class="fas fa-lock"></i>

                                Confirm Password

                            </label>

                            <div class="password-box">

                                <input
                                    type="password"
                                    id="pass2"
                                    name="pass2"
                                    class="form-control"
                                    placeholder="Confirm Password"
                                    minlength="8"
                                    maxlength="20"
                                    required>

                                <span
                                    class="toggle-password"
                                    onclick="togglePassword('pass2', this)">

                                    <i class="fas fa-eye"></i>

                                </span>

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Submit Button -->

                <button
                    type="submit"
                    class="login-btn">

                    <i class="fas fa-user-plus"></i>

                    Create Account

                </button>

            </form>

            <div class="divider">

                <span>OR</span>

            </div>

            <div class="signup-link">

                Already have an account?

                <a href="/">

                    Sign In

                </a>

            </div>

        </div>

    </div>

</div>

<script>

function togglePassword(id, element){

    const input = document.getElementById(id);

    const icon = element.querySelector("i");

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }else{

        input.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}

</script>

{% endblock body %}
